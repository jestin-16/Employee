{% extends 'base.html' %}

{% block page_title %}Remove Employee{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card p-4 p-md-5 text-center">
            <div class="stat-icon-wrapper mx-auto mb-3" style="background: #fef2f2; color: #dc2626; width: 54px; height: 54px;">
                <i class="bi bi-trash3 fs-4"></i>
            </div>
            <h5 class="fw-bold mb-1">Remove Employee Record?</h5>
            <p class="text-muted small mb-4">
                Are you sure you want to remove <strong>{{ object.first_name }} {{ object.last_name }}</strong> (<code>{{ object.employee_id }}</code>)? This action cannot be undone.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center">
                    <a href="{% url 'employee_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
