{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}Record Attendance{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card p-4 p-md-5">
            <div class="mb-4">
                <h5 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Log Daily Attendance</h5>
                <p class="text-muted small mb-0">Record member check-in and check-out timestamps.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-4 pt-3 border-top border-light d-flex gap-2 justify-content-end">
                    <a href="{% url 'attendance_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Save Entry</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
