apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: microproject-virtualization
  labels:
    app: ems-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems-web
  template:
    metadata:
      labels:
        app: ems-web
    spec:
      containers:
      - name: web
        image: ems-web:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
            name: http
        envFrom:
          - configMapRef:
              name: ems-config
        env:
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: ems-secrets
                key: SECRET_KEY
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ems-secrets
                key: DB_PASSWORD
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: microproject-virtualization
spec:
  type: ClusterIP
  selector:
    app: ems-web
  ports:
    - port: 8000
      targetPort: 8000
      name: http

