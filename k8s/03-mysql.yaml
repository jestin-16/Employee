apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: microproject-virtualization
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: microproject-virtualization
  labels:
    app: ems-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-mysql
  template:
    metadata:
      labels:
        app: ems-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        args:
          - "--default-authentication-plugin=mysql_native_password"
          - "--character-set-server=utf8mb4"
        env:
          - name: MYSQL_DATABASE
            valueFrom:
              configMapKeyRef:
                name: ems-config
                key: DB_NAME
          - name: MYSQL_USER
            valueFrom:
              configMapKeyRef:
                name: ems-config
                key: DB_USER
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ems-secrets
                key: DB_PASSWORD
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ems-secrets
                key: MYSQL_ROOT_PASSWORD
        ports:
          - containerPort: 3306
            name: mysql
        volumeMounts:
          - name: mysql-storage
            mountPath: /var/lib/mysql
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: microproject-virtualization
spec:
  type: ClusterIP
  selector:
    app: ems-mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql

