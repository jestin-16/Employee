apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: microproject-virtualization
  labels:
    app: ems-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems-nginx
  template:
    metadata:
      labels:
        app: ems-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
          - containerPort: 80
            name: http
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: microproject-virtualization
spec:
  type: NodePort
  selector:
    app: ems-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http

