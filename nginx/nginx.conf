user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip compression for static assets
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Upstream backend pool (Django Gunicorn container)
    upstream django_app {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Live Nginx status module
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # Nginx health check probe
        location /healthz {
            return 200 'OK - Nginx Reverse Proxy Live';
            add_header Content-Type text/plain;
        }

        # Direct offload of static files from shared Docker volume
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Direct offload of uploaded media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Reverse proxy dynamic traffic to Django WSGI
        location / {
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect off;

            # Proxy buffer settings
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
        }
    }
}

