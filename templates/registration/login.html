<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PeopleCore</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        body { 
            background: #fbfbfd;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 1.5rem;
            color: #0f172a;
            letter-spacing: -0.015em;
        }

        .auth-card { 
            width: 100%;
            max-width: 390px; 
            padding: 2.75rem 2.25rem; 
            border-radius: 24px; 
            background: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 20px 40px -15px rgba(0, 0, 0, 0.07);
            border: 1px solid rgba(0, 0, 0, 0.06);
            animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.25rem;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
            margin-bottom: 1.25rem;
            transition: transform 0.2s ease;
        }

        .brand-icon:hover {
            transform: scale(1.05);
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            transition: all 0.18s ease;
            background-color: #fbfbfd;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn-signin {
            background-color: #0f172a;
            border: none;
            color: #ffffff;
            border-radius: 12px;
            padding: 0.72rem;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.12);
        }

        .btn-signin:hover {
            background-color: #1e293b;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
        }

        .btn-signin:active {
            transform: scale(0.98);
        }

        .demo-chip {
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 14px;
            padding: 1rem;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="bi bi-person-workspace"></i>
            </div>
            <h4 class="fw-bold mb-1" style="letter-spacing: -0.03em;">PeopleCore</h4>
            <p class="text-muted small mb-0">Sign in to your workforce dashboard</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-signin w-100">
                Continue <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        {% if form.errors %}
            <div class="alert alert-danger border-0 mt-3 py-2 small d-flex align-items-center" style="border-radius: 10px; font-size: 0.82rem;">
                <i class="bi bi-exclamation-circle me-2"></i> Invalid credentials.
            </div>
        {% endif %}

        <!-- Clean Demo Credentials -->
        <div class="demo-chip mt-4">
            <div class="fw-semibold text-dark mb-1 text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.06em; color: #64748b;">Demo Logins</div>
            <div class="d-flex justify-content-between text-muted mb-1">
                <span>Administrator</span>
                <code>admin / admin123</code>
            </div>
            <div class="d-flex justify-content-between text-muted">
                <span>HR Manager</span>
                <code>hrmanager / Password@123</code>
            </div>
        </div>
    </div>
</body>
</html>
